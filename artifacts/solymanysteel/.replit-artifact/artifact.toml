kind = "web"
previewPath = "/"
title = "Al Solyymany Steel"
version = "1.0.0"
id = "artifacts/solymanysteel"
router = "path"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 21384

[services.development]
run = "pnpm --filter @workspace/solymanysteel run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/solymanysteel", "run", "build" ]
serve = "static"
publicDir = "artifacts/solymanysteel/dist/public"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "21384"
BASE_PATH = "/"
